name: Release

# Tags main and publishes a GitHub release. Run it from the Actions tab after the
# release/<x.y.z> branch has been merged into main (GitFlow).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (must match package.json on main)
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Gate the release on the same checks CI runs. Without this, `release` only
  # verified that the version input matched `package.json` — a tag and a GitHub
  # release could be published from a tree that does not typecheck, lint, or
  # pass its tests, which is worse than having no release automation at all.
  # Mirrors this repo's own ci.yml verify job so the two cannot drift apart.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Same rationale as ci.yml: native postinstall model-binary downloads are
      # not needed for verify, and skipping them drops a third-party CDN from
      # every release run.
      - run: npm ci --ignore-scripts
      # Next generates the LayoutProps/PageProps types that app/ references, so
      # typegen must precede `tsc --noEmit` or the typecheck fails on a missing
      # name rather than a real type error.
      - run: npx next typegen
        if: ${{ hashFiles('next.config.*') != '' }}
      - run: npm run verify

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check the version matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$VERSION" ]; then
            echo "package.json on main is $pkg, expected $VERSION" >&2
            exit 1
          fi
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target main --title "v$VERSION" --generate-notes
